schema_version: bean/2.0.0
id: bean-002
repo: beekeeper-lab/shelving-planner-py
title: Core domain models for events, tables, guests and groups
intent: >
  The vocabulary of the product exists as validated data structures, so that rules and
  the exporter have something concrete to refer to.
status: approved
approval:
  approved_by: "Gregg Reed (bulk approval, delegated)"
  approved_at: "2026-09-14T18:38:56Z"
  order: 2
source:
  kind: manual
  ref: benchmark/shelving-planner/requirements/REQUIREMENTS.md
  date: "2026-09-14"
  excerpt: "FR-006: Each table SHALL have a unique identifier, display name or number, shelving capacity, shape, and position on a two-dimensional room layout. FR-016: Each guest record SHALL contain a unique identifier, display name, RSVP status, and party or household association."
context:
  read_paths:
    - src/shelving_planner/__init__.py
    - pyproject.toml
  background: >
    Everything downstream depends on these shapes. An Event holds Tables and Guests; a
    Table has a capacity, a shape and an (x, y) position; a Guest has an RSVP status and
    belongs to a household. Table positions are relative canvas coordinates on an
    arbitrary unit plane, not physical measurements (see the bean set's recorded
    assumption for PRD §18.2) — proximity in FR-014 is well defined either way.
    "Eligible" is a derived property, not a stored field: a guest is eligible when
    Confirmed, or Pending with an explicitly reserved seat (FR-019).
allowed_write_paths:
  - src/shelving_planner/domain/**
  - tests/domain/**
acceptance_criteria:
  - id: ac1
    text: A Table rejects a capacity below one and rejects a duplicate identifier within an event.
    verify: { kind: test, test_id: "tests/domain/test_table.py::test_capacity_and_id_validation" }
  - id: ac2
    text: RSVP status accepts exactly Confirmed, Pending, Declined and Cancelled, and rejects anything else.
    verify: { kind: test, test_id: "tests/domain/test_guest.py::test_rsvp_status_values" }
  - id: ac3
    text: A guest is eligible when Confirmed, or Pending with a reserved seat, and not otherwise.
    verify: { kind: test, test_id: "tests/domain/test_guest.py::test_eligibility_rule" }
  - id: ac4
    text: A guest may belong to more than one group.
    verify: { kind: test, test_id: "tests/domain/test_group.py::test_guest_in_multiple_groups" }
  - id: ac5
    text: An event rejects more than 500 guests, 60 tables, or 5000 rules.
    verify: { kind: test, test_id: "tests/domain/test_event.py::test_production_limits" }
constraints:
  # Same shape of statement as a non-goal, and checked the same way: two of these
  # three are about a PLACE, and a place is countable. The third is about a type
  # and stays the audit's — bean-002's hidden tests check it structurally instead.
  - text: no persistence in this bean
    forbidden_imports: [sqlite3, sqlalchemy, psycopg, psycopg2, pymongo, redis, shelve, pickle]
  - text: no exporter imports
    forbidden_imports: [chardet]
  - table position is a float pair on an arbitrary unit plane
suggested_risk_tier: 1
size_budget: { max_tasks: 6, max_files: 5, max_diff_lines: 400 }
definition_of_done:
  - all AC verify pass
  - gates green
  - spec and impl-detail docs accepted
non_goals:
  # The text of each is unchanged. Two of the three are statements about a PLACE,
  # and a place is checkable: spec-check refuses a task that plans to write into
  # one before any work starts, and the gate refuses a diff that lands in one.
  # The third is about a concept and stays the audit's to judge.
  #
  # This matters here more than it reads. gpt-oss:120b was measured on 2026-09-16
  # accepting a spec that plans work its bean forbids in 2 attempts out of 3, and
  # `contradicts-non-goal` was one of the cases bench/controller-fitness.sh had as
  # "not decidable from the documents, needs a judge". It is decidable when the
  # bean says where.
  - no seat-level positions (deferred; see PRD §18.3 assumption)
  - text: no rule model (bean-003)
    # bean-003 owns the rule model. A Rule type arriving here would make bean-003
    # edit a file outside its own write paths.
    forbidden_paths:
      - "src/shelving_planner/domain/rule*.py"
      - "src/shelving_planner/domain/rules/**"
      - "src/shelving_planner/rules/**"
  - text: no database
    # "no persistence in this bean" is also a constraint. This is the part of it a
    # grep over the diff can settle.
    forbidden_imports: [sqlite3, sqlalchemy, psycopg, psycopg2, pymongo, redis, shelve]
dependencies: [bean-001]
