schema_version: tasks/1.0.0
bean_id: bean-001
tasks:
  - id: task-1
    title: Add pyproject.toml and extend .gitignore
    intent: >
      Implement the complete seating optimizer: domain models, the
      CP-SAT solver, soft-constraint scoring, the persistence layer,
      the REST API and the report renderer, all wired together and
      covered by tests.
    write_paths: [pyproject.toml, .gitignore]
    depends_on: []
    satisfies: [ac2, ac3]
    verify:
      # Must fail: before this task there is no pyproject.toml and no
      # tool config; the assert on tool.mypy/python_version distinguishes
      # "a pyproject exists" from "the config this bean needs exists".
      - kind: command
        run:
          [sh, -c, "python -c \"import tomllib; d = tomllib.load(open('pyproject.toml','rb')); p = d['project']; assert p['name'] == 'seating-planner', p['name']; assert p['requires-python'] == '>=3.11', p['requires-python']; assert any('ortools' in s.lower() for s in p['dependencies']), p['dependencies']; m = d['tool']['mypy']; assert m['python_version'] == '3.11', m; assert m['strict'] is True, m; r = d['tool']['ruff']; assert r['target-version'] == 'py311', r; assert d['tool']['pytest']['ini_options']['testpaths'] == ['tests']\""]
      # Must fail: .gitignore currently holds only "factory/runs/"; the
      # grep asserts the new entries are present AND the old line survived
      # (appended to, not replaced).
      - kind: command
        run:
          [sh, -c, "grep -qx 'factory/runs/' .gitignore && grep -qx '__pycache__/' .gitignore && grep -qx '*.pyc' .gitignore && grep -qx '.pytest_cache/' .gitignore && grep -qx '.mypy_cache/' .gitignore && grep -qx '.ruff_cache/' .gitignore && grep -qx '.coverage' .gitignore && grep -qx '.venv/' .gitignore"]
      # Must fail if task code is added carelessly; passes today and must
      # keep passing — guards that the declaration breaks nothing.
      - kind: command
        run: ["ruff", "check", "."]
      - kind: command
        run: ["ruff", "format", "--check", "."]
    max_attempts: 3
    teaching_note: >
      The declaration comes first so every later file is written into an
      environment where the lint, types, format, and test configurations
      already exist — otherwise each task would have to guess the tool
      setup and the gates would be asserting against different things,
      which is exactly what this bean is trying to end. Tool versions are
      intentionally absent from this file; gates.lock.yaml owns them.
  - id: task-2
    title: Create the seating_planner package module
    intent: >
      Create exactly one file, src/seating_planner/__init__.py: a module
      docstring stating the package is the Local Dark Factory line's
      wedding-seating project and that this bean ships the scaffold only,
      followed by a version statement __version__ = "0.1.0" (kept in sync
      with the pyproject.toml version written by task-1). No other
      modules, no imports of ortools, no logic — the bean forbids
      application logic and the invariant seam belongs to a later bean.
      Must be ruff-clean (rules E,F,I,UP,B), ruff format-clean, and pass
      under mypy strict. The version statement is load-bearing: it gives
      the unit gate's --cov-fail-under=60 one measurable, covered line in
      src/.
    write_paths: [src/seating_planner/__init__.py]
    depends_on: [task-1]
    satisfies: [ac1, ac3]
    verify:
      # Must fail: the module does not exist yet. Import plus version
      # shape is behaviour, not file existence (the gate sandbox sets
      # PYTHONPATH=<repo>/src, per factory/pipeline-config.json).
      - kind: command
        run:
          ["python", "-c", "import seating_planner; v = seating_planner.__version__; assert isinstance(v, str) and v.count('.') == 2, v"]
      - kind: command
        run: ["mypy", "src"]
      - kind: command
        run: ["ruff", "check", "."]
      - kind: command
        run: ["ruff", "format", "--check", "src"]
    max_attempts: 3
    teaching_note: >
      The smallest possible package that is still a real package: importable,
      versioned, type-checked, and covered. The version statement exists so
      the coverage floor measures something instead of passing vacuously on
      zero lines — the scaffold is not allowed to reproduce the vacuous-green
      failure mode it was built to remove.
  - id: task-3
    title: Add the scaffold test that ac4 names
    intent: >
      Create tests/test_scaffold.py containing, at a minimum,
      test_package_imports — the exact test id ac4's verify names — which
      imports seating_planner and asserts the package is what it claims
      to be (__name__ == "seating_planner" and __version__ is a semver-shaped
      string like "0.1.0" — i.e. two dots), plus one further assertion that pins
      the version shape (e.g. two dots). Every function is annotated
      -> None, imports sorted (ruff I), and the file is ruff
      format-clean. Do not create tests/__init__.py: rootdir collection
      with testpaths=["tests"] does not need it. No other test files.
    write_paths: [tests/test_scaffold.py]
    depends_on: [task-2]
    satisfies: [ac2, ac4]
    verify:
      # Must fail before this task: no test file, pytest exits nonzero
      # (no tests collected) rather than passing.
      - kind: command
        run: ["pytest", "-q", "tests/test_scaffold.py::test_package_imports"]
      # Must fail if the test is hollow: running the real unit gate
      # command proves collection, the test, and the 60% coverage floor
      # on src all hold at once.
      - kind: command
        run: ["pytest", "-q", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=60"]
      - kind: command
        run: ["ruff", "check", "tests"]
      - kind: command
        run: ["ruff", "format", "--check", "tests"]
    max_attempts: 3
    teaching_note: >
      The test exists to make ac4's verify a named, stable id and to give the
      line its first assertion that the scaffold does what its declaration
      says. Running the full unit gate command inside verify catches a test
      that would pass pytest but fail the coverage floor.