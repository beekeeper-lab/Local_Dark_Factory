schema_version: bean/2.0.0
id: bean-033
repo: beekeeper-lab/seating-planner-py
title: An infeasibility report folds locks into its multi-cause search, and names a lock as a lock
intent: >
  Building on bean-032's multi-rule diagnosis, a planning or low-disruption solve that is
  infeasible because of locks, alone or together with hard rules or a seat shortage, gets a
  report naming every lock whose release is part of the necessary fix as an unlock
  recommendation carrying that guest's id and the locked table's id, rather than as a
  problem with the hard rules; and across every combination the full report's named causes
  are each necessary and together sufficient.
status: approved
approval:
  approved_by: "Gregg Reed (owner, directly)"
  approved_at: "2026-10-08T08:00:00Z"
  order: 33
source:
  kind: manual
  ref: evidence/reviews/retroactive-20260928.md
  date: "2026-10-08"
  excerpt: "bean-028: When locks are the cause, the report blames \"hard rules\". When no single unlock fixes it, no lock is named."
context:
  read_paths:
    - src/seating_planner/solver/
    - src/seating_planner/domain/
    - tests/solver/
  background: >
    The second half of bean-028, split out on 2026-10-08 after both of bean-028's runs hit
    the worker's wall-clock limit mid-generation (see bean-032's background for the
    measurements and the timeline). bean-032 builds the subset search over hard rules and
    the seat limit; this bean extends that same search's removable set to include the
    event's stored locks, so a lock is tried for release alongside rules rather than being
    diagnosed by a separate one-removal probe, and reported through an unlock
    recommendation (guest_id, table_id) rather than through a change_hard_rule note.

    Measured on the main branch, planning mode: three guests locked to a one-seat table,
    with room elsewhere and no hard rules at all, are told the hard rules are jointly
    unsatisfiable and no lock is named. Two guests locked to a one-seat table plus a
    contradictory pair of hard rules name nothing. In low-disruption mode, a movement
    limit of 0 that a lock forces past, plus a contradictory pair, names only the two
    rules; removing them leaves it unsolvable, because the lock was never part of the
    search. A lock is already named by an unlock recommendation when it is the one single
    cause; today the guest and the table are only in its message, not in typed fields.
allowed_write_paths:
  - src/seating_planner/solver/**
  - tests/solver/**
acceptance_criteria:
  - id: ac1
    text: When locks cause the infeasibility, including when no single unlock would fix it and including together with hard rules or a seat shortage, the report has one unlock recommendation per named lock, carrying that guest's id as guest_id and the locked table's id as table_id, and every change_hard_rule recommendation still names a rule in conflict_rule_ids.
    verify: { kind: test, test_id: "tests/solver/test_complete_diagnosis.py::test_locks_are_named_as_locks" }
  - id: ac2
    text: In planning and low-disruption modes, every named rule and lock is part of some conflict, and removing all named rules, releasing all named locks, lifting the movement limit if raise_movement_limit is recommended, and removing the seat limit if a shortfall is counted makes the event solvable in the same mode.
    verify: { kind: test, test_id: "tests/solver/test_complete_diagnosis.py::test_named_causes_are_real_and_enough" }
  - id: ac3
    text: Every existing solver test still passes unchanged, including bean-032's.
    verify: { kind: command, run: ["pytest", "-q", "tests/solver"] }
constraints:
  - '"part of some conflict" means there is a set of the event''s hard rules, locks, seat limit and movement limit that cannot all hold, and can once that one is removed'
  - conflict_rule_ids stays a sorted tuple of rule ids; capacity_shortfall keeps its meaning
  - the solve_event signature is unchanged, and the report stays frozen and serializable through to_dict
  - a diagnosis probe that runs out of time names nothing it has not proved
  - diagnosis solves run with one search worker whatever the caller asked for, because an infeasible core is only reliable with one; the worker count recorded for the chart solve is unaffected
suggested_risk_tier: 2
size_budget: { max_tasks: 3, max_files: 4, max_diff_lines: 450 }
definition_of_done:
  - all AC verify pass
  - gates green
  - spec and impl-detail docs accepted
non_goals:
  - no change to the event-day diagnosis (bean-025)
  - no guarantee that the named set is the smallest one
  - no new recommendation kinds
dependencies: [bean-010, bean-011, bean-013, bean-032]
